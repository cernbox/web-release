name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type: prod (bumped vX.Y.Z release) or dev (timestamped release, no version bump)"
        required: true
        type: choice
        options:
          - prod
          - dev
        default: "prod"
      bump:
        description: "Release bump (prod only, ignored for dev)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.release_type == 'prod'
        with:
          python-version: '3.x'
          architecture: 'x64'
      - name: Install bump2version
        if: inputs.release_type == 'prod'
        run: pip install bump2version
      - name: Bump version and tag
        if: inputs.release_type == 'prod'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config --local user.email "cernbox-admins@cern.ch"
          git config --local user.name "cernbox-admins[bot]"
          bump2version "$BUMP"
      - name: Create dev tag
        if: inputs.release_type == 'dev'
        run: |
          git config --local user.email "cernbox-admins@cern.ch"
          git config --local user.name "cernbox-admins[bot]"
          git tag "dev-$(date -u +%Y%m%d%H%M%S)"
      - name: Push changes
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TARGET_REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${GHCR_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin HEAD:"${TARGET_REF}"
          git push origin --tags
