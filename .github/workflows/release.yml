name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type: prod (bumped vX.Y.Z release) or dev (timestamped release, no version bump)"
        required: true
        type: choice
        options:
          - prod
          - dev
        default: "prod"
      bump:
        description: "Release bump (prod only, ignored for dev)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - uses: actions/setup-python@v4
        if: github.event.inputs.release_type == 'prod'
        with:
          python-version: '3.x'
          architecture: 'x64'
      - uses: BSFishy/pip-action@v1
        if: github.event.inputs.release_type == 'prod'
        with:
          packages: |
            bump2version
      - name: Bump version and tag
        if: github.event.inputs.release_type == 'prod'
        run: |
          git config --local user.email "cernbox-admins@cern.ch"
          git config --local user.name "cernbox-admins[bot]"
          bump2version ${{ github.event.inputs.bump }}
      - name: Create dev tag
        if: github.event.inputs.release_type == 'dev'
        run: |
          git config --local user.email "cernbox-admins@cern.ch"
          git config --local user.name "cernbox-admins[bot]"
          git tag "dev-$(date -u +%Y%m%d%H%M%S)"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GHCR_TOKEN }}
          tags: true
